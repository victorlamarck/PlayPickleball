services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: scores
      POSTGRES_PASSWORD: scores
      POSTGRES_DB: scores
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scores -d scores"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Firestore emulator + Emulator Suite UI (http://localhost:4000), rules from firestore.rules.
  firestore:
    build: docker/firebase-emulator
    ports:
      - "8081:8081"  # Firestore API
      - "4000:4000"  # Emulator Suite UI
      - "4400:4400"  # emulator hub (used by the UI)
      - "9150:9150"  # Firestore websocket (used by the UI)
    volumes:
      - ./firebase.json:/firebase/firebase.json:ro
      - ./firestore.rules:/firebase/firestore.rules:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/ || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 60

  # Optional: the usual dev loop runs the API on the host with `make run`.
  api:
    profiles: ["api"]
    build: .
    environment:
      ENV: dev
      DATABASE_URL: postgresql+asyncpg://scores:scores@postgres:5432/scores
      GCP_PROJECT_ID: demo-live-scores
      FIRESTORE_EMULATOR_HOST: firestore:8081
      API_KEY: dev-scorekeeper-key
      INTERNAL_TOKEN: dev-internal-token
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      firestore:
        condition: service_healthy

volumes:
  pgdata:
